[package]
name = "oicpp-ce"
version = "1.5.0"
description = "OICPP IDE for competitive programming"
authors = ["mywwzh <mywwzh@163.com>"]
homepage = "https://oicpp.mywwzh.top/"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "oicpp_ce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync", "fs", "net"] }
futures-util = "0.3"

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls", "charset", "http2"] }

encoding_rs = "0.8"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"

uuid = { version = "1", features = ["v4"] }
rand = "0.8"
chrono = "0.4"
regex = "1"
once_cell = "1"
url = "2"

notify = "6"
portable-pty = "0.8"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "time"] }
sevenz-rust = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
