name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }} ${{ matrix.target || 'default' }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"
            artifact: windows-artifacts
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            artifact: macos-arm64-artifacts
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--bundles deb,appimage"
            artifact: linux-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 渲染层源码已在本仓库（frontend-src/），构建不再依赖 oicpp-origin 子模块
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.target }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            build-essential \
            curl wget file libssl-dev libxdo-dev

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      # 渲染层在 clangd 缺失时会抛错并导致 Monaco 编辑器创建失败，必须随包分发。
      # Windows / Linux 上游一定有产物，失败即中断；macOS 可能没有 arm64 产物，允许降级。
      - name: Prepare clangd bundle
        run: npm run prepare:clangd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: ${{ startsWith(matrix.platform, 'macos') }}

      - name: Generate frontend (from frontend-src)
        run: npm run prepare:frontend

      - name: Generate app icons
        run: npx tauri icon src-tauri/icons/icon.png -o src-tauri/icons
        continue-on-error: true

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # tag 构建 -> 该 tag 的正式 Release；普通 push -> 各平台的滚动 pre-release。
          # 不再使用 actions/upload-artifact：它会占用仓库的 Actions 存储配额，
          # 额度满时整个 job 失败，且服务端重算周期 6-12 小时不可控。
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-latest-{0}', matrix.artifact) }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('OICPP IDE {0}', github.ref_name) || format('滚动构建 · {0}', matrix.artifact) }}
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/v') }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}

